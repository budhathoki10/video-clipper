# Render Blueprint: one Docker web service that runs the dashboard, the API and the background
# worker. Create it in Render with New > Blueprint and pick this repository. Step by step:
# docs/DEPLOY_RENDER.md
#
# The server keeps nothing of its own: accounts, jobs and settings are in MongoDB, and videos and
# clips are in the S3-compatible storage. So no disk is needed.
#
# Values marked `sync: false` are asked for in the Render dashboard the first time. They are never
# stored in this file or in the repository.
services:
  - type: web
    name: clipper
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Video work needs about 2 GB of memory. The free plan is too small and sleeps.
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Scratch space for the video being processed. It is emptied when the job finishes.
      - key: CLIPPER_DATA_DIR
        value: /tmp/clipper
      # MongoDB connection string (Atlas): accounts, jobs, clips, posts, settings, keys.
      - key: MONGODB_URI
        sync: false
      # Encrypts each person's saved API keys and YouTube token. Generated once; never change it.
      - key: APP_SECRET_KEY
        generateValue: true
      # Google "Web application" OAuth client: app sign-in, and connecting each person's channel.
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      # The NVIDIA key everyone uses by default. People add their own keys for other providers.
      - key: NVIDIA_API_KEY
        sync: false
      # Where downloaded videos and finished clips are kept.
      - key: BLOMP_ACCESS_KEY_ID
        sync: false
      - key: BLOMP_SECRET_ACCESS_KEY
        sync: false
      - key: BLOMP_BUCKET
        sync: false
